<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LULC | Intelligence Portal v2.0</title>
  <script defer src="https://unpkg.com/img-comparison-slider@7/dist/index.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/img-comparison-slider@7/dist/styles.css"/>
  <style>
    :root { --bg: #050505; --card: #121212; --accent: #00ff88; --text: #e0e0e0; --error: #ff4444; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
    
    /* Layout */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-top: 30px; }
    .viewer-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #222; }

    /* Metrics & Status */
    .status-pill { background: #1a3325; color: var(--accent); padding: 4px 12px; border-radius: 12px; font-size: 0.7rem; border: 1px solid var(--accent); }
    .impact-metrics { display: flex; gap: 20px; margin-top: 20px; }
    .metric-box { background: #000; padding: 15px; border-radius: 10px; flex: 1; border: 1px solid #333; }

    /* Form Styles */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
    input, select, textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); color: black; font-weight: 800; padding: 14px; border: none; cursor: pointer; border-radius: 6px; width: 100%; text-transform: uppercase; margin-top: 10px; }
    
    /* Verification Queue */
    #queue { margin-top: 20px; font-size: 0.8rem; }
    .pending-item { border-left: 3px solid #ffaa00; padding: 10px; background: #1a1a1a; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <header class="dashboard-header">
    <div><h1>LULC <span style="color:var(--accent)">INTELLIGENCE</span></h1></div>
    <div class="status-pill">● REGISTRY VERIFIED</div>
  </header>

  <div class="grid">
    <!-- Viewer -->
    <section class="viewer-card">
      <img-comparison-slider>
        <img slot="first" src="https://via.placeholder.com/800x400/000/fff?text=2020+Baseline" />
        <img slot="second" src="https://via.placeholder.com/800x450/222/0f8?text=2026+Monitoring" />
      </img-comparison-slider>
      
      <div class="impact-metrics">
        <div class="metric-box"><h4>AREA ALTERED</h4><p>12.4 Hectares</p></div>
        <div class="metric-box"><h4>RISK RATING</h4><p style="color:var(--accent)">MODERATE</p></div>
      </div>
    </section>

    <!-- Submission & Verification -->
    <aside class="viewer-card">
      <h3>Submit New Change</h3>
      <form id="proForm">
        <div class="form-group"><label>GPS COORDINATES</label><input type="text" placeholder="12.97° N, 77.59° E" required></div>
        <div class="form-group"><label>CHANGE TYPE</label>
          <select><option>Urban Expansion</option><option>Deforestation</option><option>Restoration</option></select>
        </div>
        <div class="form-group">
          <input type="checkbox" id="compliance" required>
          <label style="display:inline; font-size:0.7rem;">I certify these images are authentic & GPS data is accurate.</label>
        </div>
        <button type="submit">Publish to Registry</button>
      </form>
      
      <div id="queue">
        <h4>PENDING VERIFICATION</h4>
        <div class="pending-item">Site: Sector 4 - Under Review</div>
      </div>
    </aside>
  </div>
</div>

<script>
  document.getElementById('proForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const loc = document.querySelector('input').value;
    const item = document.createElement('div');
    item.className = 'pending-item';
    item.innerText = `Site: ${loc} - Awaiting Analysis`;
    document.getElementById('queue').appendChild(item);
    alert('Submission sent to Admin Queue for verification.');
  });
</script>

</body>
</html>
